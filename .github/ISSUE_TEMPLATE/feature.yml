name: Feature request
description: Propose an explainable and privacy-conscious extension.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Decision problem
      description: Describe the decision failure the feature would address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: auditability
    attributes:
      label: Auditability and privacy
      description: Explain how inputs, assumptions, exclusions and private data will remain visible and controlled.
    validations:
      required: true
