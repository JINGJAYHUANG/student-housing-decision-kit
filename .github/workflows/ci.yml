name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""

      - name: Install package
        run: python -m pip install --no-deps -e .

      - name: Compile package
        run: python -m compileall -q src scripts tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Scan public tree
        run: python scripts/privacy_scan.py

      - name: Generate fixed synthetic demo
        run: |
          rm -rf ci-output
          housing-decision evaluate \
            --listings examples/synthetic_city/listings.csv \
            --preferences examples/synthetic_city/preferences.json \
            --as-of 2026-06-15 \
            --generated-at 2026-06-15T12:00:00Z \
            --output-dir ci-output

      - name: Verify demo bundle
        run: python scripts/verify_demo.py --output-dir ci-output

      - name: Check portable reproducibility
        run: python scripts/compare_demo.py examples/synthetic_city/output ci-output
