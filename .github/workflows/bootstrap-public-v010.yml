name: Bootstrap public v0.1.0

on:
  push:
    branches:
      - feat/public-v0.1.0
    paths:
      - .bootstrap/trigger.txt

permissions:
  contents: write

concurrency:
  group: student-housing-bootstrap-v010
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.tar.xz.b64.part-* | base64 --decode > "$RUNNER_TEMP/source.tar.xz"
          printf '%s  %s\n' \
            '9a86d729cc5f8884d0c9f7386aa0c6fb690eec4ea574d1ef19f5142a86c4e6d5' \
            "$RUNNER_TEMP/source.tar.xz" | sha256sum -c -

      - name: Extract archive with path and link checks
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/source.tar.xz" DEST="$RUNNER_TEMP/source-tree" python - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          archive = Path(os.environ["ARCHIVE"])
          destination = Path(os.environ["DEST"])
          destination.mkdir(parents=True, exist_ok=True)
          root = destination.resolve()
          with tarfile.open(archive, "r:xz") as handle:
              for member in handle.getmembers():
                  candidate = (destination / member.name).resolve()
                  if candidate != root and root not in candidate.parents:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"archive links are not allowed: {member.name}")
              handle.extractall(destination, filter="data")
          PY

      - name: Replace placeholder with verified source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' "$RUNNER_TEMP/source-tree/" ./

      - name: Normalize cross-runtime reproducibility contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          compare_script = '''#!/usr/bin/env python3
          """Compare deterministic demo outputs across Python and SQLite versions."""

          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import sqlite3
          import sys
          from pathlib import Path


          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def file_map(directory: Path) -> dict[str, Path]:
              return {
                  str(path.relative_to(directory)): path
                  for path in sorted(directory.rglob("*"))
                  if path.is_file()
              }


          def sqlite_payload(path: Path) -> dict[str, object]:
              connection = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
              try:
                  tables = connection.execute(
                      "SELECT name, sql FROM sqlite_master "
                      "WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name"
                  ).fetchall()
                  payload: dict[str, object] = {}
                  for name, schema in tables:
                      safe_name = str(name).replace('"', '""')
                      columns = [
                          str(row[1])
                          for row in connection.execute(
                              f'PRAGMA table_info("{safe_name}")'
                          ).fetchall()
                      ]
                      order_clause = ", ".join(
                          f'"{column.replace(chr(34), chr(34) * 2)}"'
                          for column in columns
                      )
                      query = f'SELECT * FROM "{safe_name}"'
                      if order_clause:
                          query += f" ORDER BY {order_clause}"
                      rows = [list(row) for row in connection.execute(query).fetchall()]
                      payload[str(name)] = {
                          "schema": str(schema or ""),
                          "columns": columns,
                          "rows": rows,
                      }
                  return payload
              finally:
                  connection.close()


          def normalized_manifest(path: Path) -> dict[str, object]:
              payload = json.loads(path.read_text(encoding="utf-8"))
              output_files = payload.get("output_files")
              if isinstance(output_files, dict) and "decision.sqlite" in output_files:
                  output_files["decision.sqlite"] = "<semantic-sqlite-comparison>"
              return payload


          def main(argv: list[str] | None = None) -> int:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("expected", type=Path)
              parser.add_argument("actual", type=Path)
              args = parser.parse_args(argv)

              expected = args.expected.resolve()
              actual = args.actual.resolve()
              if not expected.is_dir() or not actual.is_dir():
                  print("Both arguments must be output directories.", file=sys.stderr)
                  return 2

              expected_files = file_map(expected)
              actual_files = file_map(actual)
              errors: list[str] = []

              missing = sorted(set(expected_files) - set(actual_files))
              extra = sorted(set(actual_files) - set(expected_files))
              if missing:
                  errors.append(f"missing files: {', '.join(missing)}")
              if extra:
                  errors.append(f"unexpected files: {', '.join(extra)}")

              byte_count = 0
              common = sorted(set(expected_files) & set(actual_files))
              for name in common:
                  if name == "decision.sqlite":
                      if sqlite_payload(expected_files[name]) != sqlite_payload(actual_files[name]):
                          errors.append("semantic mismatch: decision.sqlite")
                  elif name == "run_manifest.json":
                      if normalized_manifest(expected_files[name]) != normalized_manifest(actual_files[name]):
                          errors.append("normalized content mismatch: run_manifest.json")
                  else:
                      expected_hash = digest(expected_files[name])
                      actual_hash = digest(actual_files[name])
                      if expected_hash != actual_hash:
                          errors.append(
                              f"content mismatch: {name} ({expected_hash} != {actual_hash})"
                          )
                      else:
                          byte_count += 1

              if errors:
                  print(
                      f"Portable deterministic comparison failed with {len(errors)} difference(s):",
                      file=sys.stderr,
                  )
                  for error in errors:
                      print(f"- {error}", file=sys.stderr)
                  return 1

              print(
                  "Portable deterministic comparison passed: "
                  f"{byte_count} file(s) byte-identical; SQLite schema/data and "
                  "the normalized manifest match."
              )
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          '''
          compare_script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in compare_script.splitlines()
          ) + "\n"
          Path("scripts/compare_demo.py").write_text(compare_script, encoding="utf-8")

          test_path = Path("tests/test_publication_guards.py")
          test_text = test_path.read_text(encoding="utf-8").replace(
              'self.assertIn("byte-identical", result.stdout)',
              'self.assertIn("Portable deterministic comparison passed", result.stdout)',
          )
          test_path.write_text(test_text, encoding="utf-8")

          verification_path = Path("docs/release-verification.md")
          verification_text = verification_path.read_text(encoding="utf-8").replace(
              "| Deterministic regeneration | 10 output files byte-identical |",
              "| Portable deterministic regeneration | 8 text/JSON/CSV/HTML artifacts byte-identical; SQLite schema/data and normalized manifest equivalent across runtime versions |",
          ).replace(
              "The GitHub-hosted workflow has not run because the new repository has not yet been created. The workflow is configured for Python 3.11, 3.12 and 3.13 with read-only repository permissions and pinned action revisions.",
              "GitHub-hosted verification is required on Python 3.11, 3.12 and 3.13 with read-only repository permissions and pinned action revisions before merge.",
          )
          verification_path.write_text(verification_text, encoding="utf-8")

          readme_path = Path("README.md")
          readme_text = readme_path.read_text(encoding="utf-8")
          marker = "These numbers demonstrate the model only; they are not real market information.\n"
          note = (
              "\nPortable reproducibility is verified byte-for-byte for CSV, JSON and HTML "
              "artifacts. SQLite is compared by schema and ordered row content because its "
              "physical file layout can vary across SQLite runtime versions; the manifest is "
              "normalized only for that SQLite file digest.\n"
          )
          if note.strip() not in readme_text:
              readme_text = readme_text.replace(marker, marker + note)
          readme_path.write_text(readme_text, encoding="utf-8")
          PY

      - name: Run release gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps -e .
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -v
          python scripts/privacy_scan.py
          rm -rf "$RUNNER_TEMP/ci-output"
          housing-decision evaluate \
            --listings examples/synthetic_city/listings.csv \
            --preferences examples/synthetic_city/preferences.json \
            --as-of 2026-06-15 \
            --generated-at 2026-06-15T12:00:00Z \
            --output-dir "$RUNNER_TEMP/ci-output"
          python scripts/verify_demo.py --output-dir "$RUNNER_TEMP/ci-output"
          python scripts/compare_demo.py \
            examples/synthetic_city/output \
            "$RUNNER_TEMP/ci-output"

      - name: Commit clean public source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish student housing decision kit v0.1.0"
          git push origin HEAD:feat/public-v0.1.0
